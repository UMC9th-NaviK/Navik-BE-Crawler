spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      stream:
        crawl:
          key: ${CRAWL_STREAM_KEY}
          group: ${CRAWL_GROUP_NAME}
      congestion:
        max-memory-usage: 0.7
        max-stream-length: 30
        max-pending-threshold: 10

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

naver:
  ocr:
    url: ${NAVER_OCR_URL}
    secretKey: ${NAVER_OCR_SECRET_KEY}

# Growth Analysis 설정
growth:
  github:
    enabled: true
    timeout: 10000  # 10초

# Notion 설정
notion:
  api-version: "2022-06-28"